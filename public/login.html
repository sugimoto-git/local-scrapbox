<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ログイン · Local Scrapbox</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="navbar"><span class="project-name">Local Scrapbox</span></header>
<main class="login">
 <form id="login-form" class="login-card">
  <h1>ログイン</h1>
  <label class="field-label" for="password">パスワード</label>
  <input class="field" id="password" type="password" autocomplete="current-password" required autofocus>
  <p id="login-error" class="login-error" role="alert" hidden></p>
  <div class="dialog-actions"><button class="primary" type="submit">ログイン</button></div>
 </form>
</main>
<script src="/login.js"></script>
</body></html>
