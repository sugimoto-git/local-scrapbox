# notes.sugiduino.net → Local Scrapbox（127.0.0.1:3210）
# 最初はHTTPだけの設定です。`certbot --nginx` がHTTPS用の設定を追加し、HTTPをHTTPSへ転送します。
limit_req_zone $binary_remote_addr zone=notes_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name notes.sugiduino.net;

    # JSONの読み込み（画像込み）は最大300MBまで
    client_max_body_size 300m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ログインはNginx側でも回数を制限する
    location = /api/login {
        limit_req zone=notes_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 別タブへの変更通知（Server-Sent Events）は、バッファせず長く接続を保つ
    location = /api/events {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
