<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="このMacで動く、リンクでつながるノート。"><title>my-notes · Local Scrapbox</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><style id="user-css"></style></head>
<body>
<header class="navbar">
 <button class="brand-button" id="project-menu" aria-label="プロジェクトメニュー" aria-expanded="false"><svg width="28" height="28" viewBox="0 0 32 32" fill="none"><path d="M7 3h15l5 5v21H7z" fill="white"/><path d="M22 3v6h5" fill="#b5dfb2"/><path d="M11 14h12M11 19h12M11 24h8" stroke="#65ad65" stroke-width="2"/></svg><span class="caret">⌄</span></button>
 <a class="project-name" href="#/" id="project-name">my-notes</a>
 <div class="search-wrap"><input id="search" type="search" aria-label="ページを検索" autocomplete="off" placeholder="ページを検索"><span class="search-icon"></span><kbd>⌘ K</kbd></div>
 <div class="nav-actions"><span class="local-badge" title="このMacに保存">LOCAL</span><button id="new-page" class="nav-button" aria-label="新しいページ" title="新しいページ（⌘ Enter）">＋</button><button id="help" class="nav-button help-button" aria-label="書き方のヒント">?</button><button id="profile" class="avatar" aria-label="設定">L</button></div>
</header>
<div id="menu" class="dropdown" hidden></div>
<main id="app"><div class="loading">ノートを読み込んでいます…</div></main>
<footer id="statusbar"><span id="save-status" role="status">ローカルに保存</span><span id="page-count"></span></footer>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<div id="toast" role="status" hidden></div>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<script type="module" src="/app.js"></script>
</body></html>
